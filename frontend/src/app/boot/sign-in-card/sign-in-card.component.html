<div class="card sign-in-card">
    <h2>{{ 'signIn.title' | translate }}</h2>
    <p>{{ 'signIn.text' | translate }}</p>
    @if (why()) {
        <p class="sign-in-error" role="alert">{{ why() }}</p>
    }
    <button class="btn-primary btn-large" id="sign-in-start" type="button" (click)="signIn()">{{ 'signIn.button' | translate }}</button>
</div>
