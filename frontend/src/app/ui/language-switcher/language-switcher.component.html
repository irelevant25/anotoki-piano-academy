@if (offered()) {
    <button
        #button
        type="button"
        class="switcher"
        [id]="buttonId"
        aria-haspopup="menu"
        [attr.aria-expanded]="open()"
        [attr.aria-controls]="menuId"
        [attr.aria-label]="'language.button' | translate: { name: currentName() }"
        [attr.aria-busy]="switching() ? 'true' : null"
        (click)="toggle()">
        {{ i18n.language().toUpperCase() }}
    </button>

    @if (open()) {
        <div #menu class="menu" role="menu" [id]="menuId" [attr.aria-labelledby]="buttonId" (keydown)="onMenuKeydown($event)">
            @for (language of i18n.languages(); track language.code) {
                <button type="button" role="menuitemradio" class="menu-item" [attr.aria-checked]="language.code === i18n.language()" [attr.lang]="language.code" (click)="choose(language.code)">
                    <span class="menu-label">{{ language.nativeName }}</span>
                    @if (language.code === i18n.language()) {
                        <span class="check" aria-hidden="true">✓</span>
                    }
                </button>
            }
        </div>
    }

    @if (failed()) {
        <p #note class="note" role="alert">{{ 'language.notLoaded' | translate }}</p>
    }
}
