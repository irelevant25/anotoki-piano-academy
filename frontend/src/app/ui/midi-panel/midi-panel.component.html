<button
    type="button"
    class="midi-button"
    id="midi-button"
    [class.is-connected]="midi.status().connected"
    [class.is-compact]="compact()"
    [anotokiPopoverTrigger]="box"
    [attr.aria-label]="'midi.button' | translate: { label: midi.status().connected ? midi.status().name : ('midi.none' | translate), status: statusText() }"
    [title]="statusText()">
    <span class="dot" aria-hidden="true"></span>
    <anotoki-icon name="piano" [size]="18" />
    @if (!compact()) {
        <span class="midi-label" id="midi-label">
            @if (midi.status().connected) {
                {{ midi.status().name }}
            } @else {
                {{ 'midi.none' | translate }}
            }
        </span>
    }
</button>

<!-- The family's popover: drawn over the page while open, under the button and on the screen; the focus onto the device list. -->
<anotoki-popover #box [label]="'midi.title' | translate" align="end" autoFocus [minWidth]="15">
    <div class="midi-box" id="midi-box">
        <p class="midi-box-title" id="midi-box-title">{{ 'midi.title' | translate }}</p>
        <anotoki-alert id="midi-status" class="midi-status" [tone]="midi.status().connected ? 'success' : 'warning'" announce="polite">
            @if (midi.status().connected) {
                {{ 'midi.connected' | translate: { name: midi.status().name } }}
            } @else {
                {{ problemKey() | translate }}@if (midi.problem()?.detail; as detail) {: <span lang="en">{{ detail }}</span>}
            }
        </anotoki-alert>
        <div class="midi-connect">
            <!-- The family's select is a field of its lazy forms (@anotoki/lib/ui/forms): loaded once the page is idle, never in the first load the bar is part of. -->
            @defer (on idle) {
                <anotoki-select id="midi-device-select" class="midi-device" [label]="'midi.device' | translate" hideLabel inline [options]="deviceOptions()" [value]="midi.selectedId()" (valueChange)="midi.selectedId.set($event)" />
            }
            <button anotokiButton size="sm" id="midi-connect-btn" (click)="midi.connect()">{{ 'midi.connect' | translate }}</button>
            <button anotokiButton size="sm" iconOnly id="midi-refresh-btn" [title]="'midi.rescan' | translate" [attr.aria-label]="'midi.rescan' | translate" (click)="midi.refresh()">
                <anotoki-icon name="refresh" [size]="16" />
            </button>
        </div>
    </div>
</anotoki-popover>
