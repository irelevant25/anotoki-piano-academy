@if (visible()) {
    <div class="account-panel" id="account-panel">
        @if (store.unsaved()) {
            <span class="save-status" id="save-status" [title]="'account.notSavedHint' | translate">{{ 'account.notSaved' | translate }}</span>
        }
        @if (signedIn()) {
            <span class="account-name" id="account-name">{{ auth.displayName() ?? ('account.signedIn' | translate) }}</span>
            <a class="account-link" id="account-link" [href]="auth.accountUrl()" target="_blank" rel="noopener">{{ 'account.myAccount' | translate }}</a>
            <button id="sign-out-btn" type="button" [disabled]="signingOut()" (click)="signOut()">{{ 'account.signOut' | translate }}</button>
        } @else {
            <span class="account-name" id="account-name">{{ 'account.signedOut' | translate }}</span>
            <button id="sign-in-btn" class="btn-primary" type="button" (click)="signIn()">{{ 'signIn.button' | translate }}</button>
        }
    </div>
}
