@if (visible()) {
    <div class="account-panel" id="account-panel">
        @if (store.unsaved()) {
            <span class="save-status" id="save-status" title="Some of your progress is not on the server yet. The app keeps trying.">Not saved yet</span>
        }
        <span class="account-name" id="account-name">{{ signedIn() ? auth.displayName() : 'Signed out' }}</span>
        @if (signedIn()) {
            <a class="account-link" id="account-link" [href]="auth.accountUrl()" target="_blank" rel="noopener">My account</a>
            <button id="sign-out-btn" type="button" [disabled]="signingOut()" (click)="signOut()">Sign out</button>
        } @else {
            <button id="sign-in-btn" class="btn-primary" type="button" (click)="signIn()">Sign in</button>
        }
    </div>
}
