<!-- The family's dialog (focus kept inside, Escape and the backdrop close it) around the family's form: its heading is the dialog's. -->
<anotoki-dialog class="feedback-dialog" [heading]="heading()" size="md" (dismiss)="closed.emit()">
    <anotoki-feedback-form [heading]="null" closable (closed)="closed.emit()" />
</anotoki-dialog>
