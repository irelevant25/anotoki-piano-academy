<div class="card">
    <h2>Songs</h2>
    <p>Songs unlock automatically once you know every note they use. The learning path teaches them one by one.</p>
    <ul class="song-list">
        @for (item of songs(); track item.song.id) {
            <li class="song-item" [class.is-locked]="!item.unlocked">
                <div>
                    <strong>{{ item.song.title }}</strong>
                    <br />
                    <span class="tag">{{ item.song.bpm }} BPM &middot; needs: {{ item.needs }}</span>
                </div>
                <button type="button" [attr.data-song]="item.song.id" [disabled]="!item.unlocked" (click)="play(item.song.id)">{{ item.unlocked ? 'Play' : 'Locked' }}</button>
            </li>
        }
    </ul>
</div>
