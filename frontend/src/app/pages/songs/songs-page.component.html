<anotoki-card [heading]="'songs.title' | translate">
    <div class="stack">
        <p>{{ 'songs.intro' | translate }}</p>
        <ul class="song-list">
            @for (item of songs(); track item.song.id) {
                <li class="song-item" [class.is-locked]="!item.unlocked">
                    <div class="song-text">
                        <strong>{{ item.song.title }}</strong>
                        <span class="song-needs">{{ 'songs.needs' | translate: { bpm: item.song.bpm, notes: item.needs } }}</span>
                    </div>
                    <button anotokiButton [attr.data-song]="item.song.id" [disabled]="!item.unlocked" (click)="play(item.song.id)">
                        {{ (item.unlocked ? 'songs.play' : 'songs.locked') | translate }}
                    </button>
                </li>
            }
        </ul>
    </div>
</anotoki-card>
