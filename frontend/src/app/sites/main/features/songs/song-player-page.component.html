@if (song(); as current) {
    <anotoki-card [heading]="current.title">
        @if (unlocked()) {
            <div class="practice">
                <div class="cluster controls">
                    <button anotokiButton id="sg-back" (click)="back()"><anotoki-icon name="arrowLeft" [size]="16" />{{ 'songs.back' | translate }}</button>
                    <anotoki-select id="sg-bpm" [label]="'tempo.label' | translate" [options]="tempoOptions()" [value]="bpm()" (valueChange)="chooseTempo($event)" />
                    <button anotokiButton id="sg-start" [disabled]="playing()" (click)="start()">{{ 'player.start' | translate }}</button>
                </div>
                <app-notation id="sg-notation" />
                <p class="feedback" id="sg-feedback" [class.feedback--correct]="feedback().kind === 'correct'" [class.feedback--incorrect]="feedback().kind === 'incorrect'" role="status">
                    @if (feedback().key; as key) {
                        {{ key | translate: feedback().params }}
                    }
                </p>
                <app-piano-keyboard id="sg-keyboard" [model]="keyboard" [lowMidi]="48" [highMidi]="84" />
            </div>
        } @else {
            <div class="stack">
                <p>{{ 'songs.lockedSong' | translate }}</p>
                <div class="cluster">
                    <button anotokiButton id="sg-back" (click)="back()"><anotoki-icon name="arrowLeft" [size]="16" />{{ 'songs.back' | translate }}</button>
                </div>
            </div>
        }
    </anotoki-card>
} @else {
    <anotoki-card [heading]="'songs.title' | translate">
        <div class="stack">
            <p>{{ 'songs.notFound' | translate }}</p>
            <div class="cluster">
                <button anotokiButton id="sg-back" (click)="back()"><anotoki-icon name="arrowLeft" [size]="16" />{{ 'songs.back' | translate }}</button>
            </div>
        </div>
    </anotoki-card>
}
