<!-- The anotoki family's one bar (@anotoki/lib/shell), told what is Piano Academy's - and its two widgets before the language: "Not saved yet" (on a wide bar; on a phone the menu button's dot) and the piano. -->
<anotoki-top-bar
    #bar="anotokiTopBar"
    [brand]="brand()"
    [links]="links()"
    [navLabel]="'nav.label' | translate"
    [person]="person()"
    [menuItems]="menuItems()"
    [signIn]="signIn()"
    [signOut]="signOut"
    [languages]="!inAdmin()"
    [phoneMax]="phoneMax()"
    [nameMin]="nameMin()"
    [shortBrandMax]="shortBrandMax()"
    [phoneMark]="phoneMark()"
    [menuNote]="menuNote()">
    @if (store.unsaved() && !bar.phone()) {
        <span topBarWidgets class="save-status" id="save-status" [title]="'account.notSavedHint' | translate">{{ "account.notSaved" | translate }}</span>
    }
    @if (!inAdmin()) {
        <app-midi-panel topBarWidgets [compact]="bar.phone()" />
    }
</anotoki-top-bar>
